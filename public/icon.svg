<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="190" fill="#1e3a8a" stroke="#38bdf8" stroke-width="8" opacity="0.8" />
  
  <!-- 4 Turbine Blades -->
  <g transform="translate(256, 256)">
    <g transform="rotate(0)">
      <path d="M 0,0 C 40,-30 110,-20 130,0 C 110,25 40,25 0,0 Z" fill="url(#bladeGrad)" />
    </g>
    <g transform="rotate(90)">
      <path d="M 0,0 C 40,-30 110,-20 130,0 C 110,25 40,25 0,0 Z" fill="#0ea5e9" />
    </g>
    <g transform="rotate(180)">
      <path d="M 0,0 C 40,-30 110,-20 130,0 C 110,25 40,25 0,0 Z" fill="url(#bladeGrad)" />
    </g>
    <g transform="rotate(270)">
      <path d="M 0,0 C 40,-30 110,-20 130,0 C 110,25 40,25 0,0 Z" fill="#0ea5e9" />
    </g>
    <!-- Center Hub -->
    <circle cx="0" cy="0" r="38" fill="#ffffff" />
    <circle cx="0" cy="0" r="20" fill="#0284c7" />
  </g>
</svg>

